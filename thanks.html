<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>送信完了 | YSK塗装</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --navy:   #1B3A6B;
  --navy2:  #2A5298;
  --sky:    #4A9FD4;
  --accent: #E8501A;
  --accent2:#FF6B35;
  --gold:   #F5C842;
  --cream:  #F0F6FC;
  --text:   #1A1A1A;
  --muted:  #5A6A7A;
  --border: #C8D8E8;
  --white:  #FFFFFF;
  --green:  #00A832;
}

body {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 17px;
  line-height: 1.7;
  color: var(--text);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
}

.thanks-wrap {
  max-width: 480px;
  margin: 0 auto;
  background: var(--white);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ==== ヘッダー ==== */
.thanks-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
  padding: 16px 20px;
  text-align: center;
}

.thanks-header-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: 'Noto Serif JP', serif;
  font-size: 20px;
  font-weight: 900;
  color: var(--white);
  letter-spacing: 0.05em;
}

.thanks-header-logo img {
  height: 40px;
  width: auto;
}

/* ==== メインコンテンツ ==== */
.thanks-main {
  flex: 1;
  padding: 40px 20px 32px;
  text-align: center;
}

/* チェックアイコン */
.thanks-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--green), #2DBE5A);
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(0,168,50,0.25);
  animation: popIn 0.5s ease-out;
}

@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}

.thanks-icon svg {
  width: 40px;
  height: 40px;
}

.thanks-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 24px;
  font-weight: 900;
  color: var(--navy);
  margin-bottom: 12px;
  line-height: 1.4;
}

.thanks-message {
  font-size: 15px;
  color: var(--muted);
  line-height: 1.8;
  margin-bottom: 32px;
}

.thanks-message strong {
  color: var(--text);
}

/* ==== 次のステップ ==== */
.next-step-card {
  background: var(--cream);
  border-radius: 12px;
  padding: 24px 20px;
  margin-bottom: 24px;
}

.next-step-label {
  display: inline-block;
  background: var(--navy);
  color: var(--white);
  font-size: 11px;
  font-weight: 700;
  padding: 3px 12px;
  border-radius: 20px;
  margin-bottom: 12px;
  letter-spacing: 0.08em;
}

.next-step-title {
  font-size: 18px;
  font-weight: 900;
  color: var(--navy);
  margin-bottom: 8px;
  line-height: 1.5;
}

.next-step-desc {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 20px;
}

/* LINE メリットリスト */
.line-benefits {
  text-align: left;
  margin-bottom: 20px;
}

.line-benefit-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 0;
  font-size: 14px;
  color: var(--text);
  line-height: 1.5;
}

.line-benefit-icon {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #06C755;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
}

.line-benefit-icon svg {
  width: 12px;
  height: 12px;
}

/* LINE ボタン */
.line-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 16px 20px;
  background: #06C755;
  color: var(--white);
  font-size: 17px;
  font-weight: 700;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.2s;
  box-shadow: 0 4px 16px rgba(6,199,85,0.3);
}

.line-btn:hover {
  background: #05B04C;
}

.line-btn:active {
  transform: scale(0.98);
}

.line-btn svg {
  flex-shrink: 0;
}

/* ==== トップへ戻る ==== */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 14px;
  text-decoration: none;
  padding: 12px 0;
  transition: color 0.2s;
}

.back-link:hover {
  color: var(--navy);
}

/* ==== フッター ==== */
.thanks-footer {
  background: var(--navy);
  color: rgba(255,255,255,0.6);
  padding: 20px;
  text-align: center;
  font-size: 12px;
}

.thanks-footer-logo {
  font-family: 'Noto Serif JP', serif;
  font-size: 16px;
  font-weight: 900;
  color: var(--white);
  margin-bottom: 4px;
}
</style>
</head>
